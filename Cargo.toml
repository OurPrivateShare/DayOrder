[package]
name = "dayorder"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "1.13", features = ["system-tray"] }

[build-dependencies]
slint-build = "1.13"
